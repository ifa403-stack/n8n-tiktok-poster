<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Vicifa Content App</title>
<style>
body { font-family: -apple-system, sans-serif; background: #1A1A2E; color: #E8E8E0; min-height: 100vh; display: flex; flex-direction: column; margin: 0; }
header { background: #1A1A2E; padding: 16px 40px; display: flex; align-items: center; gap: 12px; border-bottom: 3px solid #FF6B35; }
.logo { width: 40px; height: 40px; background: #FF6B35; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: white; font-weight: 700; font-size: 1.3rem; }
.brand h1 { font-size: 1.1rem; color: #FF6B35; margin: 0; }
.brand p { font-size: 0.75rem; color: #8899aa; margin: 0; }
main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 20px; }
.card { background: #16213E; border-radius: 16px; padding: 40px 36px; width: 100%; max-width: 400px; }
.card h2 { font-size: 1.8rem; margin-bottom: 8px; }
.card p { color: #8899aa; font-size: 0.9rem; margin-bottom: 28px; }
label { display: block; font-size: 0.7rem; font-weight: 600; color: #F5A623; margin-bottom: 5px; text-transform: uppercase; }
input { width: 100%; padding: 11px 14px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: #E8E8E0; font-size: 0.92rem; margin-bottom: 16px; outline: none; box-sizing: border-box; }
.btn-login { width: 100%; padding: 12px; background: #FF6B35; color: white; border: none; border-radius: 8px; font-size: 0.95rem; font-weight: 600; cursor: pointer; }
.divider { display: flex; align-items: center; gap: 12px; margin: 20px 0; color: #556677; font-size: 0.8rem; }
.divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: rgba(255,255,255,0.1); }
.btn-tiktok { width: 100%; padding: 12px; background: transparent; border: 1.5px solid rgba(255,255,255,0.2); border-radius: 8px; color: #E8E8E0; font-size: 0.92rem; cursor: pointer; text-align: center; text-decoration: none; display: block; }
.terms { background: rgba(255,255,255,0.04); border-radius: 8px; padding: 12px; margin-top: 18px; font-size: 0.78rem; color: #8899aa; text-align: center; }
.terms a { color: #F5A623; text-decoration: none; }
footer { padding: 18px; text-align: center; font-size: 0.78rem; color: #556677; border-top: 1px solid rgba(255,255,255,0.06); }
footer a { color: #FF6B35; text-decoration: none; margin: 0 8px; }
</style>
</head>
<body>
<header>
<div class="logo">V</div>
<div class="brand">
<h1>Vicifa Content App</h1>
<p>TikTok Content Automation Platform</p>
</div>
</header>
<main>
<div class="card">
<h2>Welcome Back</h2>
<p>Sign in to manage your TikTok content automation</p>
<form onsubmit="return false;">
<label>EMAIL</label>
<input type="email" placeholder="your@email.com">
<label>PASSWORD</label>
<input type="password" placeholder="password">
<button type="submit" class="btn-login">Sign In</button>
</form>
<div class="divider">or continue with</div>
<a href="#" class="btn-tiktok" onclick="loginWithTikTok(); return false;">Continue with TikTok (Login Kit)</a>
<div class="terms">By signing in, you agree to our <a href="terms-of-service.html">Terms of Service</a> and <a href="privacy-policy.html">Privacy Policy</a></div>
</div>
</main>
<footer><a href="index.html">Home</a><a href="privacy-policy.html">Privacy Policy</a><a href="terms-of-service.html">Terms of Service</a></footer>
<script>
function loginWithTikTok() {
  var ck = "sbawffd0ivj82jvpbr";
  var ru = "https://ifa403-stack.github.io/vicifa-content-app/callback.html";
  var sc = "user.info.basic,video.upload";
  var st = Math.random().toString(36).substring(2,15);
  sessionStorage.setItem("tts", st);
  var u = "https://www.tiktok.com/v2/auth/authorize/?client_key=" + ck + "&scope=" + encodeURIComponent(sc) + "&response_type=code&redirect_uri=" + encodeURIComponent(ru) + "&state=" + st;
  window.location.href = u;
}
</script>
</body>
</html>
